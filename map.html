// ═══ Naver Maps helpers ═══
// Detect mobile so we can offer nmap:// deep links + web fallback on desktop.
function _isMobileNaver() {
  return (/Android|iPhone|iPad|iPod|mobile/i.test(navigator.userAgent) ||
          (navigator.maxTouchPoints && navigator.maxTouchPoints > 1));
}

// Generate Naver Maps URLs — returns an object with href, label, icon for callers to render.
function placeURL(lat, lng, name) {
  var clean = name.replace(' (Hotel)', '').trim();
  if (_isMobileNaver()) {
    return [
      { href: 'nmap://place?lat=' + lat + '&lng=' + lng + '&name=' + encodeURIComponent(clean) + '&appname=com.naver.maps.map', label: 'Open in App' },
      { href: 'https://map.naver.com/v5/search/' + encodeURIComponent(name) + '?coord=' + lng + ',' + lat + '&zoom=17',   label: 'Open on Web' }
    ];
  }
  return [
    { href: 'https://map.naver.com/v5/search/' + encodeURIComponent(name) + '?coord=' + lng + ',' + lat + '&zoom=17', label: 'Open in Naver Maps' }
  ];
}

function routeURL(slat, slng, dlat, dlng, dname) {
  var clean = dname.replace(' (Hotel)', '').trim();
  if (_isMobileNaver()) {
    return [
      { href: 'nmap://route/car?slat=' + slat + '&slng=' + slng + '&sname=' + encodeURIComponent(clean) + '&dlat=' + dlat + '&dlng=' + dlng + '&dname=' + encodeURIComponent(clean) + '&appname=com.naver.maps.map', label: 'Route in App' },
      { href: 'https://map.naver.com/v5/search/' + encodeURIComponent(dname) + '?coord=' + dlng + ',' + dlat + '&zoom=17', label: 'Route on Web' }
    ];
  }
  return [
    { href: 'https://map.naver.com/v5/search/' + encodeURIComponent(dname) + '?coord=' + dlng + ',' + dlat + '&zoom=17', label: 'Route on Naver Maps' }
  ];
}

// ═══ STATE ═══
var map, markersLayer, routePolyline, returnPolyline, dotLayers;
var currentCity = 'seoul1', currentDay = null;

// ═══ MAP INIT ═══
function initMap() {
  if (typeof L === 'undefined') return;

  var centerLat, centerLng, zoom;
  map = L.map('map').setView([37.5665, 126.9780], 13);
  L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
    attribution: '&copy; OSM &copy; CARTO', maxZoom: 19, detectRetina: true
  }).addTo(map);

  markersLayer = L.layerGroup().addTo(map);

  // Hide loading text after tiles arrive (or give up after 3s)
  map.once('tileloadall', function() { hideLoading(); });
  setTimeout(hideLoading, 3000);
}

function hideLoading() {
  var el = document.getElementById('map-loading');
  if (el) el.classList.add('hidden');
}

function clearOverlays() {
  if (markersLayer) markersLayer.clearLayers();
  if (routePolyline) { map.removeLayer(routePolyline); routePolyline = null; }
  if (returnPolyline) { map.removeLayer(returnPolyline); returnPolyline = null; }
  if (dotLayers) { for (var i = 0; i < dotLayers.length; i++) { map.removeLayer(dotLayers[i]); } dotLayers = null; }
}

function createIcon(n) {
  return L.divIcon({
    className: '',
    html: '<div style="width:32px;height:32px;background:#059669;color:white;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:14px;box-shadow:0 2px 6px rgba(0,0,0,.25);border:2px solid white;">' + n + '</div>',
    iconSize: [32, 32], iconAnchor: [16, 16]
  });
}

function hotelIcon() {

    html: '<div style="width:34px;height:34px;background:#d97706;color:white;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;box-shadow:0 2px 8px rgba(0,0,0,.3);border:2px solid white;">&#x26ea;</div>',
    iconSize: [34, 34], iconAnchor: [17, 17]
  });

// ═══ SWITCH CITY ═══
function switchCity(city) {
  currentCity = city;
  currentDay = null;

  // Update city tab styling
  var tabs = document.querySelectorAll('.city-tab');
  for (var i = 0; i < tabs.length; i++) {
    var b = tabs[i];
    var isActive = b.getAttribute('data-city') === city;
    b.setAttribute('class',
      'city-tab px-5 py-2 font-semibold text-sm border-b-[3px] ' +
      (isActive ? 'border-emerald-700 bg-emerald-50 text-emerald-700' : 'border-transparent text-slate-400 hover:text-slate-600 hover:bg-slate-50') +
      ' transition');
  }

  // Build day tabs
  var tc = document.getElementById('day-tabs');
  tc.innerHTML = '';
  var dayKeys = Object.keys(ITINERARY[city].days);

  // Sort days: arrival first, then chronological
  function sortKey(key) {
    if (key === 'arr') return -10;
    var n = parseInt(key);
    if (!isNaN(n)) return n;
    // Extract month/day from strings like sep2, sep3
    var m = key.match(/([a-z])(\d+)/);
    if (m) {
      var months = {jan:1,feb:2,mar:3,apr:4,may:5,jun:6,jul:7,aug:8,sep:9,oct:10,nov:11,dec:12};
      return months[m[1]] * 100 + parseInt(m[2]);
    }
    return 99;
  }
  dayKeys.sort(function(a, b) { return sortKey(a) - sortKey(b); });

  for (var i = 0; i < dayKeys.length; i++) {
    var d = dayKeys[i];
    var displayDate = ITINERARY[city].days[d].date.split(' ').slice(1).join(' ');
    var shortLabel = d === 'arr' ? 'Arrival' : (d.toUpperCase());
    var isAct = currentDay === d;
    var btn = document.createElement('button');
    btn.setAttribute('data-day', d);
    btn.setAttribute('class',
      'px-4 py-1.5 font-medium text-xs border rounded-full whitespace-nowrap ' +
      (isAct ? 'border-emerald-700 bg-emerald-50 text-emerald-700' : 'border-slate-200 text-slate-500 hover:text-slate-700 hover:bg-slate-100') +
      ' transition');
    btn.textContent = shortLabel + ' - ' + displayDate;
    (function(day) {
      btn.onclick = function() { switchDay(day); };
    })(d);
    tc.appendChild(btn);
  }

  // Default to first day
  if (!currentDay || !ITINERARY[city].days[currentDay]) {
    currentDay = dayKeys[0];
  }
}

// ═══ SWITCH DAY / RENDER ═══
function switchDay(day) {
  currentDay = day;
  // Update tab highlight using data-day attribute
  var btns = document.querySelectorAll('#day-tabs button');
  for (var i = 0; i < btns.length; i++) {
    if (btns[i].getAttribute('data-day') === day) {
      btns[i].setAttribute('class', 'city-tab px-4 py-1.5 font-medium text-xs border rounded-full border-emerald-700 bg-emerald-50 text-emerald-700 transition');
    } else {
      btns[i].setAttribute('class', 'city-tab px-4 py-1.5 font-medium text-xs border rounded-full border-slate-200 text-slate-500 hover:text-slate-700 hover:bg-slate-100 transition');
    }
  }
  render(day);
}

function render(day) {
  var dd = ITINERARY[currentCity].days[day];
  if (!dd) return;

  clearOverlays();

  // Separate hotels from attractions (for pin/stop rendering only — hotels still included in route)
  var places = dd.places;
  var isHotelArr = [];
  var attractions = [];
  for (var i = 0; i < places.length; i++) {
    var h = places[i].name.indexOf('(Hotel)') !== -1;
    isHotelArr.push(h);
    if (!h) attractions.push({ origIdx: i, place: places[i] });
  }

  // Compute bounds for all places (hotels + attractions) — route includes everything
  var lats = [], lngs = [];
  var path = [];
  for (var j = 0; j < dd.places.length; j++) {
    lats.push(dd.places[j].lat);
    lngs.push(dd.places[j].lng);
    path.push([dd.places[j].lat, dd.places[j].lng]);
  }

  var centerLat = (Math.min.apply(null, lats) + Math.max.apply(null, lats)) / 2;
  var centerLng = (Math.min.apply(null, lngs) + Math.max.apply(null, lngs)) / 2;

  // Adjust zoom based on spread
  var latSpread = Math.abs(Math.max.apply(null, lats) - Math.min.apply(null, lats));
  var zoom = latSpread > 1 ? 9 : (latSpread > 0.3 ? 11 : 13);

  map.setView([centerLat, centerLng], zoom);

  // Store place reference for click handlers
  var currentPlaces = dd.places;

  // Markers
  var attractionCounter = 0;
  for (var i = 0; i < dd.places.length; i++) {
    (function(idx) {
      var place = dd.places[idx];
      var isHotel = place.name.indexOf('(Hotel)') !== -1;
      var icon = isHotel ? hotelIcon() : createIcon(attractionCounter + 1);
      if (!isHotel) attractionCounter++;
      var displayName = place.name.replace(' (Hotel)', '');
      var pinNum = isHotel ? '' : ('<b>' + attractionCounter + '. </b>');
      var m = L.marker([place.lat, place.lng], { icon: icon })
        .bindPopup(pinNum + displayName + (isHotel ? ' <span style="color:#d97706;font-weight:600;">(Hotel)</span>' : '') + '<br>' +
                   (function(_links) { var _s = ''; for (var k = 0; k < _links.length; k++) { _s += '<a href="' + _links[k].href + '" target="_blank" style="color:#059669;font-weight:600;">' + _links[k].label + '</a>' + (k < _links.length - 1 ? ' / ' : ''); } return _s; })(placeURL(place.lat, place.lng, place.name)) );
      markersLayer.addLayer(m);
      m.on('click', function() { map.panTo([place.lat, place.lng]); });
    })(i);
  }

  // Route polyline (red dashed) — connects everything including hotels
  if (dd.places.length >= 2) {
    routePolyline = L.polyline(path, { color: '#ef4444', weight: 5, opacity: 0.7, dashArray: '10 6' }).addTo(map);

    // Red dots at intermediate stops (skip hotels — they already have their own gold pin)
    dotLayers = [];
    for (var i = 1; i < dd.places.length; i++) {
      if (dd.places[i].name.indexOf('(Hotel)') === -1) {
        var dot = L.circleMarker([dd.places[i].lat, dd.places[i].lng], {
          radius: 6, fillColor: '#ef4444', color: 'white', fillOpacity: 0.9
        });
        dotLayers.push(dot);
        dot.addTo(markersLayer);
      }
    }

    // Return-to-hotel segment: last attraction back to the hotel marker (loop closed).
    // Only add if there's a real day loop (hotel + multiple attractions).
    var hotelPlace = null;
    var lastAttraction = null;
    for (var i = dd.places.length - 1; i >= 0; i--) {
      if (!hotelPlace && dd.places[i].name.indexOf('(Hotel)') !== -1) hotelPlace = dd.places[i];
      if (!lastAttraction && dd.places[i].name.indexOf('(Hotel)') === -1) lastAttraction = dd.places[i];
    }
    // Only add return segment if there's at least one hotel AND at least 2 non-hotel attractions.
    // Arrival/departure days have only 1-2 places (transit-only), so no loop back.
    if (lastAttraction && hotelPlace && lastAttraction.name.indexOf('(Hotel)') === -1 && hotelPlace !== lastAttraction) {
      // Count non-hotel attractions
      var attrCount = 0;
      for (var i = 0; i < dd.places.length; i++) {
        if (dd.places[i].name.indexOf('(Hotel)') === -1) attrCount++;
      }
      if (attrCount >= 2) {
        returnPolyline = L.polyline([
          [lastAttraction.lat, lastAttraction.lng],
          [hotelPlace.lat, hotelPlace.lng]
        ], { color: '#ef4444', weight: 5, opacity: 0.7, dashArray: '10 6' });
        returnPolyline.addTo(markersLayer);
      }
    } else {
      returnPolyline = null;
    }

    map.fitBounds(path, { padding: [50, 50] });
  } else {
    map.fitBounds([[Math.min.apply(null, lats), Math.min.apply(null, lngs)],
                   [Math.max.apply(null, lats), Math.max.apply(null, lngs)]], { padding: [50, 50] });
  }

  // Place cards (sidebar) — number attractions in sync with map pins (hotels skipped)
  var listEl = document.getElementById('place-list');
  listEl.innerHTML = '<div class="text-sm font-semibold text-emerald-700 mb-3">' + ITINERARY[currentCity].label + ' - ' + dd.date + '</div>';

  var sidebarAttractionCounter = 0;
  for (var i = 0; i < dd.places.length; i++) {
    var p = dd.places[i];
    var isHotel = p.name.indexOf('(Hotel)') !== -1;
    var card = document.createElement('div');
    card.className = 'place-card dark-card bg-white border rounded-lg p-3 mb-2';
    if (isHotel) {
      card.style.borderColor = '#d97706';
      card.style.borderLeft = '4px solid #d97706';
    } else {
      card.style.borderColor = '#e2e8f0';
    }

    var displayName = p.name.replace(' (Hotel)', '');
    if (!isHotel) sidebarAttractionCounter++;
    var pinHTML = isHotel ? '&#x26ea;' : sidebarAttractionCounter;
    var bgStyle = isHotel ? 'background:#d97706' : 'background:#059669';

    var notesHTML = p.notes ? '<div class="text-xs text-gray-500 mt-1">Note: ' + p.notes + '</div>' : '';

    // Helper to render link buttons for an array of link objects.
    function _renderLinks(links, prefix, cls) {
      var s = '';
      for (var k = 0; k < links.length; k++) {
        if (!links[k]) continue;
        var lbl = links.length > 1 ? prefix + ' (' + links[k].label + ')' : prefix;
        s += '<a class="inline-flex items-center text-xs font-semibold px-2 py-1 rounded-md ' + cls + ' transition" href="' + links[k].href + '" target="_blank">' + lbl + '</a>';
      }
      return s;
    }

    var actions = '<div class="flex gap-1.5 flex-wrap mt-2">';
    actions += _renderLinks(placeURL(p.lat, p.lng, p.name), 'Open', 'bg-emerald-700 text-white hover:bg-emerald-800');

    // Forward route — skip over any adjacent hotels to find the next attraction
    for (var jf = i + 1; jf < dd.places.length; jf++) {
      var nxt = dd.places[jf];
      if (nxt.name.indexOf('(Hotel)') === -1) {
        var fwdName = nxt.name.split('(')[0].trim().split(')')[0].trim();
        actions += _renderLinks(routeURL(p.lat, p.lng, nxt.lat, nxt.lng, nxt.name), '-> ' + fwdName, 'border border-red-300 text-red-600 hover:bg-red-50');
        break;
      }
    }
    // Backward route — skip over any adjacent hotels to find the previous attraction
    for (var jb = i - 1; jb >= 0; jb--) {
      var prev = dd.places[jb];
      if (prev.name.indexOf('(Hotel)') === -1) {
        var bwdName = prev.name.split('(')[0].trim().split(')')[0].trim();
        actions += _renderLinks(routeURL(prev.lat, prev.lng, p.lat, p.lng, p.name), '<- ' + bwdName, 'border border-red-300 text-red-600 hover:bg-red-50');
        break;
      }
    }
    actions += '</div>';

    card.innerHTML =
      '<div class="flex gap-2.5 items-start">' +
        '<div class="w-7 h-7 rounded-full flex items-center justify-center text-xs font-bold flex-shrink-0 mt-px" style="' + bgStyle + ';color:white;">' + pinHTML + '</div>' +
        '<div class="flex-1 min-w-0 dark-text">' +
          '<div class="font-semibold text-sm leading-tight truncate">' + displayName + (isHotel ? ' <span style="color:#d97706;font-weight:600;">(Hotel)</span>' : '') + '</div>' +
          notesHTML +
          '<div class="text-[10px] text-gray-400 font-mono mt-1">' + p.lat.toFixed(4) + ', ' + p.lng.toFixed(4) + '</div>' +
          actions +
        '</div>' +
      '</div>';

    (function(idx, place) {
      card.onclick = function() { map.panTo([place.lat, place.lng]); markersLayer.getLayers()[idx] && markersLayer.getLayers()[idx].openPopup(); };
    })(i, p);
    listEl.appendChild(card);
  }
}

// ═══ URL PARAMS ═══
// Support ?city=X&day=Y so index.html can link directly to a day
function getParams() {
  var p = {};
  var qs = window.location.search.substring(1);
  var parts = qs.split('&');
  for (var i = 0; i < parts.length; i++) {
    var kv = parts[i].split('=');
    if (kv[0]) p[decodeURIComponent(kv[0])] = decodeURIComponent(kv[1] || '');
  }
  return p;
}

// ═══ INIT ═══
initMap();

// Auto-detect current trip day based on today's date (during Aug 22 - Sep 8 window)
function autoDayForToday() {
  var now = new Date();
  var y = now.getFullYear(), m = now.getMonth() + 1, d = now.getDate();
  // Return mapping of month-day -> city+day key
  if (y >= 2026) {
    if (m===8 && d>=22 && d<=28) return 'seoul1';   // Seoul days arr-6
    if (m===9 && d<=4) return 'jeju';                // Jeju
    if (d===5 && m===9) return 'seoul2';             // Seoul return
  }
  return null;
}

var params = getParams();
var targetCity = params.city || autoDayForToday() || 'seoul1';

if (!ITINERARY[targetCity]) targetCity = 'seoul1';

// Determine which day to show
var targetDay = params.day;
currentCity = targetCity;
switchCity(currentCity);

// Override with URL-specified day (takes precedence over auto/default)
if (targetDay && ITINERARY[currentCity] && ITINERARY[currentCity].days && ITINERARY[currentCity].days.hasOwnProperty(targetDay)) {
  currentDay = targetDay;
  render(currentDay);

  // Sync tab highlight to match the URL-specified day
  var btns = document.querySelectorAll('#day-tabs button');
  for (var i = 0; i < btns.length; i++) {
    if (btns[i].getAttribute('data-day') === currentDay) {
      btns[i].className = 'px-4 py-1.5 font-semibold text-xs border-2 border-emerald-600 rounded-full whitespace-nowrap bg-emerald-700 text-white shadow-md scale-110 transition';
    } else {
      btns[i].className = 'px-4 py-1.5 font-medium text-xs border rounded-full whitespace-nowrap border-slate-200 text-slate-500 hover:text-slate-700 hover:bg-slate-100 transition opacity-60';
    }
  }
}
</script>
