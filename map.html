<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Korea Trip — Interactive Map</title>
    <!-- Tailwind CSS (same as index.html) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Leaflet CSS/JS — jsdelivr only (unpkg returns 404 from Korea) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.min.js"></script>
    <script>
        // Quick check: if Leaflet didn't load, show an error immediately
        window.addEventListener('load', function() {
            if (typeof L === 'undefined') {
                document.getElementById('page-body').innerHTML =
                    '<div class="flex items-center justify-center h-screen"><div class="text-center p-8">' +
                    '<h2 class="text-xl font-bold text-red-600 mb-4">Map library failed to load</h2>' +
                    '<p class="text-gray-600 mb-4">The Leaflet map library could not be loaded. Check your internet connection and refresh.</p>' +
                    '<a href="' + window.location.href + '" class="inline-block px-6 py-2 bg-emerald-700 text-white rounded-lg">Refresh</a></div></div>';
            }
        });
    </script>
    <style>
        body { margin: 0; padding: 0; font-family: 'Inter', system-ui, -apple-system, sans-serif; overflow-x: hidden; }

        /* Dark mode overrides */
        @media (prefers-color-scheme: dark) {
            .dark-text { color: #f1f5f9 !important; }
            .dark-muted { color: #94a3b8 !important; }
            .dark-bg { background-color: #0f172a !important; }
            .dark-card { background: #1e293b !important; border-color: #334155 !important; }
        }

        /* Leaflet dark mode */
        @media (prefers-color-scheme: dark) {
            .leaflet-tile-pane { filter: invert(1) hue-rotate(200deg) saturate(0.5); }
            .leaflet-control-zoom a { background: #1e293b !important; color: #cbd5e1 !important; border-color: #334155 !important; }
        }

        /* Map container — always fills remaining viewport height */
        #page-body { display: flex; flex-direction: column; height: 100vh; }
        .header-bar { min-height: 56px; max-height: 56px; flex-shrink: 0; }
        .tab-bar { min-height: 48px; max-height: 48px; flex-shrink: 0; overflow-x: auto; white-space: nowrap; }
        .content-row { flex: 1; display: flex; overflow: hidden; min-height: 0; }

        /* Sidebar */
        .sidebar { width: 360px; flex-shrink: 0; overflow-y: auto; padding: 12px 16px; background: #f8fafc; }
        @media (prefers-color-scheme: dark) { .sidebar { background: #1e293b !important; } }

        /* Map */
        #map { flex: 1; min-width: 0; background: #e8f5ee; position: relative; }
        #map-loading { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
                        color: #059669; font-weight: 600; pointer-events: none; transition: opacity 0.4s; z-index: 1000; }
        #map-loading.hidden { opacity: 0; }

        /* Place card hover */
        .place-card { transition: box-shadow 0.15s, transform 0.15s; cursor: pointer; }
        .place-card:hover { box-shadow: 0 6px 20px rgba(0,0,0,.1) !important; transform: translateY(-2px); }

        /* Mobile */
        @media (max-width: 768px) {
            .sidebar { width: 100%; max-height: 45vh; flex-shrink: 0; overflow-y: auto; }
            #map { height: 45vh !important; min-height: 200px; }
        }

        /* Dark mode content background */
        @media (prefers-color-scheme: dark) {
            .sidebar { background-color: #0f172a !important; }
        }
    </style>
</head>
<body class="dark-bg">

<!-- Full-height page body -->
<div id="page-body">
    <!-- Header (fixed 56px) -->
    <div class="header-bar bg-emerald-700 text-white flex items-center px-4 sm:px-6">
        <div class="max-w-6xl mx-auto w-full flex items-center gap-3">
            <a href="index.html" class="text-white/80 hover:text-white font-medium text-sm transition flex-shrink-0">&#x2190; Trip Plan</a>
            <h1 class="text-xl font-bold tracking-tight">Korea Itinerary Map</h1>
        </div>
    </div>

    <!-- City tabs (fixed 48px) -->
    <div class="tab-bar border-b border-slate-200 bg-white flex items-center px-4 sm:px-6 gap-2">
        <button class="px-5 py-2 font-semibold text-sm border-b-[3px] border-emerald-700 bg-emerald-50 text-emerald-700 transition"
                data-city="seoul" onclick="switchCity('seoul')">Seoul</button>
        <button class="px-5 py-2 font-semibold text-sm border-b-[3px] border-transparent text-slate-400 hover:text-slate-600 hover:bg-slate-50 transition"
                data-city="busan" onclick="switchCity('busan')">Busan</button>
    </div>

    <!-- Day tabs -->
    <div class="tab-bar bg-white flex items-center px-4 sm:px-6 gap-2 overflow-x-auto">
        <div id="day-tabs"></div>
    </div>

    <!-- Content row (fills remaining height) -->
    <div class="content-row" style="height: calc(100vh - 104px); min-height: 300px;">
        <!-- Sidebar: place list -->
        <div class="sidebar dark-card" id="place-list"></div>

        <!-- Map -->
        <div id="map">
            <div id="map-loading">Loading map&#x2026;</div>
        </div>
    </div>
</div>

<script>
// ═══════ DATA ═══════
const ITINERARY = {
  seoul: {
    days: {
      2:  { date:"Sunday Aug 23", places:[
        {name:"Seoul Children's Grand Park / Museum",     lat:37.5645,lng:127.0980},
        {name:"Seoul Forest Park",                        lat:37.5440,lng:127.1185, notes:"Deer farm & butterfly house"},
        {name:"Starfield Library (COEX Mall)",            lat:37.5126,lng:127.0535},
        {name:"Banpo Bridge Moonlight Rainbow Fountain",  lat:37.5248,lng:126.9860, notes:"Shows at 19:30 · 20:00 · 20:30 · 21:00"},
      ]},
      3:  { date:"Monday Aug 24", places:[
        {name:"National Museum of Korea",                 lat:37.5236,lng:127.0333, notes:"Free admission"},
        {name:"Namdaemun Market",                         lat:37.5638,lng:126.9940, notes:"Weekdays 11AM–5PM"},
        {name:"Myeongdong Shopping Street",               lat:37.5636,lng:126.9850, notes:"Street food stalls from ~3PM"},
        {name:"Deoksugung Palace",                        lat:37.5645,lng:126.9990, notes:"Free courtyard · stone wall road at dusk"},
      ]},
      4:  { date:"Tuesday Aug 25", places:[
        {name:"Lotte World Adventure & Magic",            lat:37.5227,lng:127.1103, notes:"Best Tue–Thu"},
      ]},
      5:  { date:"Wednesday Aug 26", places:[
        {name:"Gyeongbokgung Palace",                     lat:37.5797,lng:126.9770, notes:"Guard Changing Cer: 10:00"},
        {name:"Bukchon Hanok Village",                    lat:37.5840,lng:126.9950},
        {name:"Insadong Street",                          lat:37.5740,lng:126.9850, notes:"Traditional shops & tea houses"},
        {name:"Changdeokgung Palace (Secret Garden)",     lat:37.5790,lng:126.9990, notes:"Reservation required"},
      ]},
      6:  { date:"Thursday Aug 27", places:[
        {name:"Namsan Seoul Tower / Namsan Park",         lat:37.5514,lng:126.9880},
        {name:"Myeongdong Cathedral",                     lat:37.5642,lng:126.9970},
        {name:"Dongdaemun Design Plaza (DDP)",            lat:37.5672,lng:127.0095},
        {name:"Gwangjang Market",                         lat:37.5700,lng:127.0070, notes:"Try Korean street food here!"},
      ]},
    }
  },
  busan: {
    days: {
      1:  { date:"Saturday Aug 29", places:[
        {name:"Huinnyeoul Culture Village",               lat:35.1640,lng:129.1140},
        {name:"Jeoryeong Coastal Trail (Oryukdo)",       lat:35.1750,lng:129.1200},
        {name:"Oryukdo Skywalk",                          lat:35.1070,lng:129.0340},
      ]},
      2:  { date:"Sunday Aug 30", places:[
        {name:"Haedong Yonggungsa Temple (seaside)",     lat:35.1710,lng:129.1040},
        {name:"Blueline Park — Cheongsapo Station",  lat:35.1628,lng:129.1570},
        {name:"Shinsegae Dept Store (Centum City)",       lat:35.1672,lng:129.1197, notes:"World’s largest dept store"},
        {name:"Gwangalli Drone Light Show",               lat:35.1580,lng:129.0680, notes:"Sat 8PM · near Bronx Brewing Co"},
      ]},
      3:  { date:"Monday Aug 31", places:[
        {name:"Gamcheon Culture Village",                 lat:35.0965,lng:129.0280, notes:"Free map at Tourist Info Center"},
        {name:"Gukje Market",                             lat:35.1180,lng:129.0310},
        {name:"BIFF Square (Haeundae)",                   lat:35.1055,lng:129.0300, notes:"Try Hotteok sweet pancake"},
        {name:"Jagalchi Market",                          lat:35.1045,lng:129.0270, notes:"Korea’s largest fish market"},
        {name:"Songdo Sea Cable Car",                     lat:35.0870,lng:129.0400},
      ]},
    }
  },
};

// Naver Maps URLs (direct links — no API key needed)
function placeURL(lat, lng, name) {
  return 'https://map.naver.com/v5/search/' + encodeURIComponent(name) + '&lat=' + lat + '&lng=' + lng + '&zoom=17';
}
function routeURL(fl, fn, tl, tname) {
  return 'https://map.naver.com/v5/directions/?c=15.0,0.0,0,co,df&lat=' + fl + '&lng=' + fn + '&dlat=' + tl + '&dlng=' + encodeURIComponent(tname);
}

// ═══ STATE ═══
var map, markersLayer, routePolyline;
var currentCity = 'seoul', currentDay = null;

// ═══ MAP INIT ═══
function initMap() {
  if (typeof L === 'undefined') return; // error handler will show message

  map = L.map('map', { zoomControl: true }).setView([37.5665, 126.9780], 13);
  L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
    attribution: '&copy; OSM &copy; CARTO', maxZoom: 19, detectRetina: true
  }).addTo(map);

  markersLayer = L.layerGroup().addTo(map);

  // Hide loading text after tiles arrive (or give up after 3s)
  map.once('tileloadall', function() { hideLoading(); });
  setTimeout(hideLoading, 3000);
}

function hideLoading() {
  var el = document.getElementById('map-loading');
  if (el) el.classList.add('hidden');
}

function clearOverlays() {
  if (markersLayer) markersLayer.clearLayers();
  if (routePolyline) { map.removeLayer(routePolyline); routePolyline = null; }
}

function createIcon(n) {
  return L.divIcon({
    className: '',
    html: '<div style="width:32px;height:32px;background:#059669;color:white;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:14px;box-shadow:0 2px 6px rgba(0,0,0,.25);border:2px solid white;">' + n + '</div>',
    iconSize: [32, 32], iconAnchor: [16, 16]
  });
}

// ═══ SWITCH CITY ═══
function switchCity(city) {
  currentCity = city;

  // Update city tab styling
  var tabs = document.querySelectorAll('#city-tabs button, .header-bar + div button');
  if (tabs.length === 2) {
    for (var i = 0; i < tabs.length; i++) {
      var b = tabs[i];
      var isActive = b.getAttribute('data-city') === city;
      b.setAttribute('class',
        'px-5 py-2 font-semibold text-sm border-b-[3px] ' +
        (isActive ? 'border-emerald-700 bg-emerald-50 text-emerald-700' : 'border-transparent text-slate-400 hover:text-slate-600 hover:bg-slate-50') +
        ' transition');
    }
  }

  // Build day tabs
  var tc = document.getElementById('day-tabs');
  tc.innerHTML = '';
  var days = Object.keys(ITINERARY[city].days).sort(function(a, b) { return a - b; });
  for (var i = 0; i < days.length; i++) {
    var d = parseInt(days[i]);
    var btn = document.createElement('button');
    var isAct = currentDay === d;
    btn.setAttribute('class',
      'px-4 py-1.5 font-medium text-xs border rounded-full whitespace-nowrap ' +
      (isAct ? 'border-emerald-700 bg-emerald-50 text-emerald-700' : 'border-slate-200 text-slate-500 hover:text-slate-700 hover:bg-slate-100') +
      ' transition');
    var shortDate = ITINERARY[city].days[d].date.split(' ').slice(2).join(' ');
    btn.textContent = 'Day ' + d + ' · ' + shortDate;
    (function(day) { btn.onclick = function() { switchDay(day); }; })(d);
    tc.appendChild(btn);
  }

  // Default to first day
  if (!currentDay || !ITINERARY[city].days[currentDay]) {
    currentDay = parseInt(days[0]);
  }
  render(currentDay);
}

// ═══ SWITCH DAY / RENDER ═══
function switchDay(day) {
  currentDay = day;
  // Update tab highlight
  var btns = document.querySelectorAll('#day-tabs button');
  for (var i = 0; i < btns.length; i++) {
    if (btns[i].textContent.startsWith('Day ' + day)) {
      btns[i].setAttribute('class', 'px-4 py-1.5 font-medium text-xs border rounded-full border-emerald-700 bg-emerald-50 text-emerald-700 transition');
    } else {
      btns[i].setAttribute('class', 'px-4 py-1.5 font-medium text-xs border rounded-full border-slate-200 text-slate-500 hover:text-slate-700 hover:bg-slate-100 transition');
    }
  }
  render(day);
}

function render(day) {
  var dd = ITINERARY[currentCity].days[day];
  if (!dd) return;

  clearOverlays();

  // Compute bounds for all places on this day
  var lats = [], lngs = [];
  var path = [];
  for (var i = 0; i < dd.places.length; i++) {
    lats.push(dd.places[i].lat);
    lngs.push(dd.places[i].lng);
    path.push([dd.places[i].lat, dd.places[i].lng]);
  }

  var centerLat = (Math.min.apply(null, lats) + Math.max.apply(null, lats)) / 2;
  var centerLng = (Math.min.apply(null, lngs) + Math.max.apply(null, lngs)) / 2;

  map.setView([centerLat, centerLng], 13);

  // ── Markers ──
  for (var i = 0; i < dd.places.length; i++) {
    var p = dd.places[i];
    var m = L.marker([p.lat, p.lng], { icon: createIcon(i + 1) })
      .bindPopup('<b>' + (i + 1) + '. ' + p.name + '</b><br>' +
                 '<a href="' + placeURL(p.lat, p.lng, p.name) + '" target="_blank" style="color:#059669;font-weight:600;">Open in Naver Maps →</a>');
    markersLayer.addLayer(m);
    m.on('click', function() { map.panTo([p.lat, p.lng]); });
  }

  // ── Route polyline (red dashed) ──
  if (dd.places.length >= 2) {
    routePolyline = L.polyline(path, { color: '#ef4444', weight: 5, opacity: 0.7, dashArray: '10 6' }).addTo(map);

    // Red dots at intermediate stops
    for (var i = 1; i < dd.places.length; i++) {
      L.circleMarker([dd.places[i].lat, dd.places[i].lng], {
        radius: 6, fillColor: '#ef4444', color: 'white', fillOpacity: 0.9
      }).addTo(map);
    }

    map.fitBounds(path, { padding: [50, 50] });
  } else {
    map.fitBounds([[Math.min.apply(null, lats), Math.min.apply(null, lngs)],
                   [Math.max.apply(null, lats), Math.max.apply(null, lngs)]], { padding: [50, 50] });
  }

  // ── Place cards (sidebar) ──
  var listEl = document.getElementById('place-list');
  listEl.innerHTML = '';

  for (var i = 0; i < dd.places.length; i++) {
    var p = dd.places[i];
    var card = document.createElement('div');
    card.className = 'place-card dark-card bg-white border border-slate-200 rounded-lg p-3 mb-2';

    var notesHTML = p.notes ? '<div class="text-xs text-gray-500 mt-1">Note: ' + p.notes + '</div>' : '';

    var actions = '<div class="flex gap-1.5 flex-wrap mt-2">';
    actions += '<a class="inline-flex items-center text-xs font-semibold px-2 py-1 rounded-md bg-emerald-700 text-white hover:bg-emerald-800 transition" href="' + placeURL(p.lat, p.lng, p.name) + '" target="_blank">Open ↓</a>';

    // Forward route
    if (i < dd.places.length - 1) {
      var nxt = dd.places[i + 1];
      actions += '<a class="inline-flex items-center text-xs font-semibold px-2 py-1 rounded-md border border-red-300 text-red-600 hover:bg-red-50 transition" href="' + routeURL(p.lat, p.lng, nxt.lat, nxt.name) + '" target="_blank">→ ' + nxt.name.split('(')[0].trim() + '</a>';
    }
    // Backward route
    if (i > 0) {
      var prev = dd.places[i - 1];
      actions += '<a class="inline-flex items-center text-xs font-semibold px-2 py-1 rounded-md border border-red-300 text-red-600 hover:bg-red-50 transition" href="' + routeURL(prev.lat, prev.lng, p.lat, p.name) + '" target="_blank">← ' + prev.name.split('(')[0].trim() + '</a>';
    }
    actions += '</div>';

    card.innerHTML =
      '<div class="flex gap-2.5 items-start">' +
        '<div class="w-7 h-7 rounded-full bg-emerald-700 text-white flex items-center justify-center text-xs font-bold flex-shrink-0 mt-px">' + (i + 1) + '</div>' +
        '<div class="flex-1 min-w-0 dark-text">' +
          '<div class="font-semibold text-sm leading-tight truncate">' + p.name + '</div>' +
          notesHTML +
          '<div class="text-[10px] text-gray-400 font-mono mt-1">' + p.lat.toFixed(4) + ', ' + p.lng.toFixed(4) + '</div>' +
          actions +
        '</div>' +
      '</div>';

    card.onclick = function() { map.panTo([p.lat, p.lng]); markersLayer.getLayers()[i] && markersLayer.getLayers()[i].openPopup(); };
    listEl.appendChild(card);
  }
}

// ═══ START ═══
initMap();
switchCity('seoul');
</script>

</body>
</html>
